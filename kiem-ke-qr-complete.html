<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiểm kê kho thú y</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f4;--sf:#ffffff;--sf-2:#f8faf9;--ink:#13221d;--mu:#5f6f69;--ln:#e0e6e3;
  --ac:#0d6e5c;--ac-hv:#095446;--ac-soft:rgba(13,110,92,.1);--act:#ffffff;
  --neg:#c2332d;--ok:#e6f5ef;
  --r-sm:10px;--r-md:14px;--r-lg:20px;
  --sh-xs:0 1px 2px rgba(19,34,29,.04);--sh-sm:0 4px 14px rgba(19,34,29,.06);--sh-lg:0 -8px 28px rgba(19,34,29,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.42 "Be Vietnam Pro",system-ui,-apple-system,sans-serif;padding-bottom:calc(74px + env(safe-area-inset-bottom, 0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;transition:transform .08s ease,background-color .16s ease,border-color .16s ease}
button:active:not(:disabled){transform:scale(.98)}
button:disabled{opacity:.45;cursor:not-allowed}

header#hd{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);padding:10px 14px;box-shadow:var(--sh-xs)}
.top-bar{display:flex;gap:6px;align-items:center;margin-bottom:9px}
.sw{flex:1;min-width:0;border:1px solid var(--ln);background:var(--sf-2);border-radius:var(--r-sm);padding:8px 10px;font-size:13px;font-weight:600;outline:none;height:38px}
.who{font-size:11.5px;font-weight:600;color:var(--ac);background:var(--ac-soft);padding:5px 9px;border-radius:999px;max-width:118px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-chip{border:1px solid var(--ln);background:var(--sf);border-radius:var(--r-sm);height:38px;padding:0 10px;font-size:12.5px;font-weight:600;color:#263832;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.icon-chip:hover{background:var(--sf-2)}

.row{display:flex;gap:8px;align-items:center}
.sr{flex:1;min-width:0;border:1px solid var(--ln);background:var(--sf-2);border-radius:var(--r-sm);padding:10px 12px;font-size:14.5px;outline:none;height:44px}
.sr:focus,.num:focus,.sw:focus{border-color:var(--ac);background:var(--sf);box-shadow:0 0 0 3px rgba(13,110,92,.14)}
.scan-btn{background:#13221d;color:#fff;border:0;border-radius:var(--r-sm);padding:0 12px;height:44px;font-size:13px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.cam{background:var(--ac);color:var(--act);border:0;border-radius:var(--r-sm);padding:0 13px;height:44px;font-size:13px;font-weight:600;white-space:nowrap;box-shadow:0 2px 8px rgba(13,110,92,.22)}
.cam:hover{background:var(--ac-hv)}

.bar{height:6px;background:#e4eae7;border-radius:999px;margin:10px 0 7px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),#169b82);width:0;border-radius:999px;transition:width .3s ease}
.meta{font-size:12px;font-weight:500;color:var(--mu);display:flex;justify-content:space-between;align-items:center}
.meta b{color:var(--ink)}

.chips{display:flex;gap:7px;margin-top:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;color:#3a4c46;white-space:nowrap}
.chip.on{background:var(--ac);color:var(--act);border-color:var(--ac);box-shadow:0 2px 6px rgba(13,110,92,.2)}

.item{display:flex;gap:12px;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--sf);border:0;border-bottom:1px solid var(--ln);padding:13px 14px}
.item:hover{background:var(--sf-2)}
.item.done{background:linear-gradient(90deg,rgba(13,110,92,.045),var(--sf) 28%);box-shadow:inset 4px 0 0 var(--ac)}
.item-main{min-width:0;flex:1}
.item b{display:block;font-weight:600;font-size:14.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;margin-top:3px}
.badge-ok{font-size:10.5px;font-weight:700;color:var(--ac);background:var(--ac-soft);padding:1px 6px;border-radius:6px}
.vals{text-align:right;font-size:12.5px;font-weight:600;color:#2b3d37;white-space:nowrap;line-height:1.35}

.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r-md);padding:15px;margin-bottom:12px;box-shadow:var(--sh-xs)}
.card h3{margin:0 0 8px;font-size:15px;font-weight:700}
.card .item{border:1px solid var(--ln);border-radius:var(--r-sm);margin-bottom:8px;padding:11px 12px}
.card .item:last-of-type{margin-bottom:0}
.card .item.done{box-shadow:inset 3px 0 0 var(--ac)}

.fld{display:block;margin-top:10px;font-size:12.5px;font-weight:600;color:#364842}
.fld .sr,.fld select,.fld textarea{width:100%;margin-top:5px;color:var(--ink);background:var(--sf-2);border-radius:var(--r-sm)}
.fld select{border:1px solid var(--ln);padding:9px 10px;height:42px;outline:none}
.fld textarea.sr{height:auto;min-height:96px;padding:10px 12px}

.file-box{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border:1px dashed #9cb3aa;background:var(--sf-2);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:10px}
.file-name{font-size:12.5px;color:var(--mu);flex:1;min-width:140px;word-break:break-all}

.snap-card{margin-top:10px;border:1px solid var(--ln);background:var(--sf-2);border-radius:var(--r-md);padding:12px;text-align:center}
.cam-status{font-size:12.5px;color:var(--mu);margin-top:8px;text-align:center}

.warn{background:var(--ok);border:1px solid #b5e3d1;border-left:4px solid var(--ac);color:#0b4f42;padding:9px 12px;border-radius:var(--r-sm);margin-bottom:12px;font-size:13px;font-weight:500}
.empty{padding:42px 24px;text-align:center;color:var(--mu);font-size:14px}

.lg{display:flex;gap:10px;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r-md);padding:11px 12px;margin-bottom:8px;font-size:13.5px;box-shadow:var(--sh-xs)}
.lg small{color:var(--mu);font-size:11.5px;display:block;margin-top:2px}
.tg{flex:none;font-size:11px;font-weight:700;text-transform:uppercase;border-radius:7px;padding:3px 8px;height:fit-content;color:var(--ac);background:var(--ac-soft)}

.ov{position:fixed;inset:0;background:rgba(13,24,20,.52);backdrop-filter:blur(2px);z-index:40;display:none;align-items:flex-end}
.ov.on{display:flex}
.sh{background:var(--sf);width:100%;max-height:92%;overflow:auto;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom, 0px));box-shadow:var(--sh-lg)}
.sh::before{content:"";display:block;width:40px;height:4px;border-radius:999px;background:#d2dcd7;margin:0 auto 12px}
.sh h3{margin:0;font-size:16.5px;font-weight:700}

.pl{border:1px solid var(--ln);background:var(--sf-2);border-radius:var(--r-md);padding:11px 12px;margin-top:11px}
.step{width:46px;height:46px;border-radius:var(--r-sm);border:1px solid var(--ln);background:var(--sf);font-size:22px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--sh-xs)}
.step:hover{background:#eef3f0}
.num{flex:1;min-width:0;text-align:center;font-size:21px;font-weight:700;border:1px solid var(--ln);background:var(--sf);border-radius:var(--r-sm);height:46px;outline:none}

.btns{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
.btns button,.bt{padding:11px 14px;border-radius:var(--r-sm);border:1px solid var(--ln);background:var(--sf);font-size:13.5px;font-weight:600}
.btns button{flex:1;min-width:110px}
.btns .pri,.bt.pri{background:var(--ac);color:var(--act);border-color:var(--ac);box-shadow:0 2px 8px rgba(13,110,92,.22)}
.btns .pri:hover,.bt.pri:hover{background:var(--ac-hv)}
.btns .dan{color:var(--neg);border-color:#f3c6c3;background:#fff8f8}

nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom, 0px);box-shadow:0 -2px 10px rgba(19,34,29,.04)}
nav button{flex:1;border:0;background:none;padding:10px 4px 11px;font-size:12px;font-weight:600;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:19px;height:19px}
nav button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}

#gate{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:500;z-index:80;display:none;box-shadow:var(--sh-sm);max-width:90vw;text-align:center}

.paper{background:#fff;color:#111;border:1px solid var(--ln);border-radius:var(--r-md);padding:16px;font-family:"Times New Roman",Times,serif;font-size:14px}
.tw{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font:12px/1.32 "Times New Roman",Times,serif}
th,td{border:1px solid #666;padding:4px 6px}
th{background:#eef1f0;text-align:center}
td.r{text-align:right}td.c{text-align:center}

@media print{
  header,nav,.btns,.warn,#toast{display:none!important}
  body{padding:0;background:#fff}
  .paper{border:0;padding:0}
}
</style>
</head>
<body>
<header id="hd">
  <div class="top-bar">
    <select id="sw" class="sw"></select>
    <span id="who" class="who"></span>
    <button class="icon-chip" id="syncBtn" title="Đồng bộ dữ liệu">↻ Đồng bộ</button>
    <button class="icon-chip" id="out" title="Đăng xuất">Thoát</button>
  </div>
  <div class="row">
    <input id="q" class="sr" type="search" placeholder="Quét / nhập mã hoặc tên (Enter để mở)..." autocomplete="off">
    <button class="scan-btn" id="scanOpenBtn" title="Quét mã trực tiếp bằng camera">📷 Quét</button>
    <button class="cam" id="camBtn" title="Thêm vật tư lẻ">+ Lẻ</button>
  </div>
  <div class="bar"><i id="pg"></i></div>
  <div class="meta"><span id="mt"></span><span id="mt2"></span></div>
  <div class="chips" id="chips"></div>
</header>

<section id="setup" style="display:none;padding:12px"></section>
<main id="list"></main>
<section id="rep" style="display:none;padding:12px"></section>
<section id="hist" style="display:none;padding:12px"></section>
<section id="conf" style="display:none;padding:12px"></section>

<nav>
  <button id="t0" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>Thiết lập</span>
  </button>
  <button id="t1" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    <span>Kiểm kê</span>
  </button>
  <button id="t2" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
    <span>Biên bản</span>
  </button>
  <button id="t3" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    <span>Lịch sử</span>
  </button>
  <button id="t4" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
    <span>Xác nhận</span>
  </button>
</nav>

<div class="ov" id="sheet"><div class="sh" id="shc"></div></div>
<div id="gate"><div class="card" id="gcard" style="width:100%;max-width:380px;margin:0"><h3>Kiểm kê kho thú y</h3><p style="color:var(--mu)">Đang kết nối dữ liệu Google Sheet...</p></div></div>
<div id="toast"></div>

<script>
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var fmt = function(n){ return (n == null || n === '') ? '' : Number(n).toLocaleString('vi-VN', {maximumFractionDigits:3}); };
var rd = function(n){ return Math.round(Number(n || 0) * 1000) / 1000; };
var na = function(s){ return String(s == null ? '' : s).normalize('NFD').toLowerCase().replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').trim(); };
var today = function(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
var tsf = function(t){ var d = new Date(t || Date.now()); return d.toLocaleString('vi-VN'); };
var ssG = function(k){ try { return sessionStorage.getItem(k); } catch(e) { return null; } };
var ssS = function(k,v){ try { if(v==null) sessionStorage.removeItem(k); else sessionStorage.setItem(k,v); } catch(e) {} };
var lsG = function(k){ try { return localStorage.getItem(k); } catch(e) { return null; } };
var lsS = function(k,v){ try { localStorage.setItem(k,v); } catch(e) {} };

function toast(msg){
  var t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.h); toast.h = setTimeout(function(){ t.style.display = 'none'; }, 2400);
}

function gasCall(fn){
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function(ok, no){
    if (!window.google || !google.script || !google.script.run) return no(new Error('Không có google.script.run'));
    var runner = google.script.run.withSuccessHandler(ok).withFailureHandler(no);
    runner[fn].apply(runner, args);
  });
}

var STORE = { sess:[], items:[], stock:[], zones:[], cnt:[], done:[], lg:[], users:[] };
var SUBS = [];
var CUR_REV = '0', MUT_Q = [], MUT_T = 0, FLUSHING = false, SYNCING = false;
var ACC = null, USERS = [], ADM = false, MGR = false, UID = null, DISPN = 'Bạn';
var ST = { cur: lsG('kk_cur'), list: [] };
var tab = 1, filt = 'all', curIdx = -1, READY = false, LOADED = false;
var lastUploadedFileName = '';

var LIVE_SCAN_STATE = {
  active: false,
  stream: null,
  timer: null,
  busy: false,
  generation: 0,
  reader: null,
  detector: null,
  zxingLoading: false
};

function stopLiveScan(){
  LIVE_SCAN_STATE.active = false;
  LIVE_SCAN_STATE.generation++;
  LIVE_SCAN_STATE.busy = false;
  if (LIVE_SCAN_STATE.timer) {
    clearTimeout(LIVE_SCAN_STATE.timer);
    LIVE_SCAN_STATE.timer = null;
  }
  if (LIVE_SCAN_STATE.reader) {
    try {
      LIVE_SCAN_STATE.reader.stopAsyncDecode();
      LIVE_SCAN_STATE.reader.stopContinuousDecode();
    } catch (e) {}
  }
  if (LIVE_SCAN_STATE.stream) {
    try {
      LIVE_SCAN_STATE.stream.getTracks().forEach(function(tr){ tr.stop(); });
    } catch (e) {}
    LIVE_SCAN_STATE.stream = null;
  }
  var vid = $('liveVid');
  if (vid) {
    try { vid.srcObject = null; } catch (e) {}
    vid.style.display = 'none';
  }
  var guide = $('qrGuide');
  if (guide) guide.style.display = 'none';
}

function blank(id){ return { id:id, name:'', title:'BIÊN BẢN KIỂM KÊ KHO THÚ Y', place:'', date:today(), asof:'', plants:[], closed:null, cr:0, zones:[], _zm:{}, items:[], c:{}, n:{}, cm:{}, done:{}, logs:[], _it:[], _st:null }; }
var EMPTY = blank('');
function X(){ return ST.list.find(function(s){ return s.id === ST.cur; }) || EMPTY; }
function lock(){ return !X().id || !!X().closed; }
function zmap(s){ var m = {}; (s.zones||[]).forEach(function(z){ (z.codes||[]).forEach(function(c){ m[c] = z; }); }); return m; }
function canCount(code){ var s = X(); if (MGR || !s.zones.length) return true; var z = s._zm[code]; return !z || (z.users||[]).indexOf(UID) >= 0; }
function inScope(code){ var s = X(); if (MGR || !s.zones.length) return true; var z = s._zm[code]; return !!z && (z.users||[]).indexOf(UID) >= 0; }
function scopeIdx(){ return X().items.map(function(_,i){ return i; }).filter(function(i){ return inScope(X().items[i][0]); }); }
function isDone(i){ return (X().c[X().items[i][0]] || []).some(function(v){ return v != null; }); }
function lt(i,k){ return X().items[i][3][k] || 0; }
function dif(i,k){ var q = (X().c[X().items[i][0]] || [])[k]; return q == null ? null : rd(q - lt(i,k)); }
function hasDiff(i){ return X().plants.some(function(_,k){ var d = dif(i,k); return d != null && d !== 0; }); }
function ck(sid,code){ return sid + '_' + String(code).replace(/[^A-Za-z0-9_-]/g, '_'); }

function closeSheet(){
  stopLiveScan();
  $('sheet').classList.remove('on');
}
function rebuild(s){ s.items = (s._it||[]).map(function(row){ return [row[0], row[1], row[2], (s._st && s._st[row[0]]) || s.plants.map(function(){ return 0; })]; }); }

function notifySubs(col){
  SUBS.filter(function(s){ return s.col === col; }).forEach(function(s){
    var docs = (STORE[col]||[]).map(function(r){ return { id:r.id, data:function(){ return r.data; }, exists:true }; });
    if (s.whereField) docs = docs.filter(function(d){ return d.data()[s.whereField] === s.whereVal; });
    s.cb({ docs:docs });
  });
}

function queueMut(m){ MUT_Q.push(m); clearTimeout(MUT_T); MUT_T = setTimeout(flushMuts, 300); }

function flushMuts(){
  clearTimeout(MUT_T);
  if (!MUT_Q.length || FLUSHING) return Promise.resolve();
  FLUSHING = true;
  var batch = MUT_Q.splice(0, MUT_Q.length);
  return gasCall('apiBatchWrite', batch).then(function(res){
    if (res && res.rev) CUR_REV = String(res.rev);
  }).catch(function(e){
    MUT_Q = batch.concat(MUT_Q);
    toast((e && e.message) || 'Lỗi lưu Sheet');
  }).finally(function(){
    FLUSHING = false;
    if (MUT_Q.length) { clearTimeout(MUT_T); MUT_T = setTimeout(flushMuts, 400); }
  });
}

var DB = {
  doc: function(path){
    var parts = path.split('/'), col = parts[0], id = parts.slice(1).join('/');
    return {
      set: function(data){
        var copy = JSON.parse(JSON.stringify(data));
        var idx = STORE[col].findIndex(function(x){ return x.id === id; });
        if (idx >= 0) STORE[col][idx].data = copy; else STORE[col].push({ id:id, data:copy });
        notifySubs(col);
        queueMut({ col:col, op:'set', id:id, data:copy });
        return Promise.resolve();
      },
      update: function(data){
        var copy = JSON.parse(JSON.stringify(data));
        var idx = STORE[col].findIndex(function(x){ return x.id === id; });
        if (idx >= 0) Object.assign(STORE[col][idx].data, copy); else STORE[col].push({ id:id, data:copy });
        notifySubs(col);
        queueMut({ col:col, op:'update', id:id, data:copy });
        return Promise.resolve();
      },
      delete: function(){
        STORE[col] = STORE[col].filter(function(x){ return x.id !== id; });
        notifySubs(col);
        queueMut({ col:col, op:'delete', id:id });
        return Promise.resolve();
      }
    };
  },
  collection: function(col){
    return {
      onSnapshot: function(cb){

var ZXING_LOAD_PROMISE = null;
function ensureZxingLoaded(cb){
  if (window.ZXing && window.ZXing.BrowserMultiFormatReader) {
    cb(true);
    return;
  }
  if (!ZXING_LOAD_PROMISE) {
    ZXING_LOAD_PROMISE = new Promise(function(resolve){
      var urls = [
        'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js',
        'https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js'
      ];
      var index = 0;
      function loadNext(){
        if (index >= urls.length) {
          resolve(false);
          return;
        }
        var sc = document.createElement('script');
        sc.async = true;
        sc.src = urls[index++];
        sc.onload = function(){
          if (window.ZXing && window.ZXing.BrowserMultiFormatReader) resolve(true);
          else {
            if (sc.parentNode) sc.parentNode.removeChild(sc);
            loadNext();
          }
        };
        sc.onerror = function(){
          if (sc.parentNode) sc.parentNode.removeChild(sc);
          loadNext();
        };
        document.head.appendChild(sc);
      }
      loadNext();
    }).then(function(loaded){
      if (!loaded) ZXING_LOAD_PROMISE = null;
      return loaded;
    });
  }
  ZXING_LOAD_PROMISE.then(cb);
}

function triggerSearchAndOpen(rawCode){
  var code = String(rawCode || '').trim();
  if (!code) return;
  stopLiveScan();

  var qInput = $('q');

    qInput.dispatchEvent(new Event('input', { bubbles: true }));
  }
  if (typeof renderList === 'function') renderList();
  $('sheet').classList.remove('on');

  var s = X();
  if (!s || !Array.isArray(s.items)) return;

  var exactIdx = s.items.findIndex(function(it){ return na(it[0]) === na(code); });
  if (exactIdx >= 0) {
    openSheet(exactIdx);
    return;
  }

  var matches = s.items.map(function(_,i){ return i; }).filter(function(i){
    return na(s.items[i][0]).indexOf(na(code)) >= 0 || na(s.items[i][1]).indexOf(na(code)) >= 0;
  });
  if (matches.length === 1) {
    openSheet(matches[0]);
    return;
  }

  if (!matches.length) {
    toast('Đã đẩy mã "' + code + '" vào ô tìm kiếm');
  } else {
    toast('Tìm thấy ' + matches.length + ' vật tư khớp mã "' + code + '"');

}

function scanFrameLoop(generation){
  if (!LIVE_SCAN_STATE.active || generation !== LIVE_SCAN_STATE.generation) return;
  LIVE_SCAN_STATE.timer = null;
  var vid = $('liveVid');
  var st = $('camSt');
  if (!vid || vid.readyState < 2 || !vid.videoWidth || !vid.videoHeight) {
    LIVE_SCAN_STATE.timer = setTimeout(function(){ scanFrameLoop(generation); }, 120);
    return;
  }
  if (LIVE_SCAN_STATE.busy) {
    LIVE_SCAN_STATE.timer = setTimeout(function(){ scanFrameLoop(generation); }, 120);
    return;
  }
  LIVE_SCAN_STATE.busy = true;

  var w = vid.videoWidth, h = vid.videoHeight;
  var maxW = 1280;
  var scale = w > maxW ? (maxW / w) : 1;
  var cw = Math.max(1, Math.round(w * scale));
  var ch = Math.max(1, Math.round(h * scale));
  var canvas = document.createElement('canvas');
  canvas.width = cw;
  canvas.height = ch;
  var ctx = canvas.getContext('2d', { willReadFrequently:true });
  var nativeDecode = Promise.resolve(null);
  if (LIVE_SCAN_STATE.detector && ctx) {
    ctx.drawImage(vid, 0, 0, cw, ch);
    nativeDecode = Promise.resolve().then(function(){
      return LIVE_SCAN_STATE.detector.detect(canvas);
    }).then(function(codes){
        return (codes && codes.length && codes[0].rawValue) ? codes[0].rawValue : null;
    }).catch(function(){ return null; });
  }

  nativeDecode.then(function(found){
    if (found) return found;
    if (window.ZXing && window.ZXing.BrowserMultiFormatReader) {
      if (!LIVE_SCAN_STATE.reader) LIVE_SCAN_STATE.reader = new window.ZXing.BrowserMultiFormatReader();
      return LIVE_SCAN_STATE.reader.decodeFromVideoElement(vid).then(function(res){
        return (res && res.text) ? res.text : null;
      }).catch(function(){ return null; });
    }
    return null;
  }).then(function(code){
    if (generation !== LIVE_SCAN_STATE.generation) return;
    LIVE_SCAN_STATE.busy = false;
    if (!LIVE_SCAN_STATE.active) return;
    if (code && String(code).trim()) {
      if (st) st.textContent = 'Đã nhận mã: ' + String(code).trim();
      triggerSearchAndOpen(String(code).trim());
      return;
    }
    if (!LIVE_SCAN_STATE.detector && !window.ZXing && !LIVE_SCAN_STATE.zxingLoading && st) {
      st.textContent = 'Không tải được bộ đọc QR. Kiểm tra kết nối rồi bật lại camera.';
    }
    LIVE_SCAN_STATE.timer = setTimeout(function(){ scanFrameLoop(generation); }, 120);
  }).catch(function(){
    if (generation !== LIVE_SCAN_STATE.generation) return;
    LIVE_SCAN_STATE.busy = false;
    if (LIVE_SCAN_STATE.active) {
      LIVE_SCAN_STATE.timer = setTimeout(function(){ scanFrameLoop(generation); }, 180);
    }
  });
}

function startLiveCameraScan(){
  stopLiveScan();
  var generation = LIVE_SCAN_STATE.generation;
  var st = $('camSt');
  var vid = $('liveVid');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    if (st) st.textContent = 'Trình duyệt không hỗ trợ camera trực tiếp — hãy nhập/quét mã vào ô bên dưới.';
    return;
  }
  if (st) st.textContent = 'Đang bật camera trực tiếp, vui lòng cấp quyền camera...';
  LIVE_SCAN_STATE.detector = null;
  LIVE_SCAN_STATE.zxingLoading = true;
  if (window.BarcodeDetector) {
    try { LIVE_SCAN_STATE.detector = new window.BarcodeDetector({ formats:['qr_code'] }); }
    catch (e) { LIVE_SCAN_STATE.detector = null; }
  }
  ensureZxingLoaded(function(loaded){
    if (generation !== LIVE_SCAN_STATE.generation) return;
    LIVE_SCAN_STATE.zxingLoading = false;
    if (!loaded && !LIVE_SCAN_STATE.detector && st) {
      st.textContent = 'Không tải được bộ đọc QR. Kiểm tra kết nối mạng.';
    }
  });

  navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  }).then(function(stream){
    if (generation !== LIVE_SCAN_STATE.generation) {
      stream.getTracks().forEach(function(tr){ tr.stop(); });
      return;
    }
    LIVE_SCAN_STATE.active = true;
    LIVE_SCAN_STATE.stream = stream;
    if (vid) {
      vid.srcObject = stream;
      vid.style.display = 'block';
      Promise.resolve().then(function(){ return vid.play(); }).then(function(){
        if (generation !== LIVE_SCAN_STATE.generation || !LIVE_SCAN_STATE.active) return;
        var guide = $('qrGuide');
        if (guide) guide.style.display = 'block';
        if (st) st.textContent = 'Đang quét QR. Đưa mã vào giữa khung hình.';
        LIVE_SCAN_STATE.timer = setTimeout(function(){ scanFrameLoop(generation); }, 100);
      }).catch(function(err){
        if (generation !== LIVE_SCAN_STATE.generation) return;
        stopLiveScan();
        if (st) st.textContent = 'Không phát được hình camera (' + ((err && err.message) || 'lỗi phát video') + ').';
      });
    }
  }).catch(function(err){
    if (generation !== LIVE_SCAN_STATE.generation) return;
    var msg = (err && err.name === 'NotAllowedError')
      ? 'Camera bị chặn bởi quyền trình duyệt/khung nhúng. Cho phép Camera trong Chrome; nếu vẫn lỗi, mở Web App trực tiếp thay vì nhúng.'
      : 'Không mở được camera trực tiếp (' + ((err && err.message) || 'lỗi thiết bị') + ') — hãy nhập/quét mã vào ô bên dưới.';
    if (st) st.textContent = msg;
  });
}

  }).join('') : '<div class="empty">Không có vật tư phù hợp</div>';

function saveCount(){
  if (lock()) return;
  var s = X(), it = s.items[curIdx], code = it[0];
  if (!canCount(code)) { toast('Không có quyền đếm mã này'); return; }
  var q = s.plants.map(function(_,k){
    var v = ($('n'+k).value || '').trim().replace(',','.');
    return v === '' || isNaN(v) ? null : Number(v);
  });
  var note = ($('note').value || '').trim();
  s.c[code] = q; if (note) s.n[code] = note; else delete s.n[code];
  DB.doc('cnt/' + ck(s.id, code)).set({ sid: s.id, code:code, q:q, n:note, u:UID, t:Date.now() }).then(function(){
    logEv('count', 'Đếm ' + code + ': ' + q.map(function(x){ return x==null?'—':x; }).join('/'), code);
    closeSheet();
    refresh();
    toast('Đã lưu số đếm');
  });

function importPaste(txt){
  if (!MGR || lock()) { toast('Chỉ Admin/TP mới nhập khi đợt đang mở'); return; }
  var cleanTxt = String(txt || '').replace(/^\uFEFF/, '');
  var lines = cleanTxt.split(/\r?\n/).map(function(l){ return l.trim(); }).filter(Boolean);
  if (!lines.length) { toast('Chưa có dữ liệu'); return; }
  var sep = lines[0].indexOf('\t') >= 0 ? '\t' : lines[0].indexOf(';') >= 0 ? ';' : ',';
  var rows = lines.map(function(l){ return l.split(sep).map(function(c){ return c.replace(/^["']|["']$/g, '').trim(); }); });
  var start = /ma|material/.test(na(rows[0][0])) ? 1 : 0;
  var map = new Map(), plants = [];
  rows.slice(start).forEach(function(r){
    var code = r[0]; if (!code) return;
    var p = r[4] || 'MAIN';
    if (plants.indexOf(p) < 0) plants.push(p);
    if (!map.has(code)) map.set(code, { n: r[1]||'', u: r[2]||'', q: {} });
    var o = map.get(code);
    o.q[p] = (o.q[p] || 0) + (parseFloat(String(r[3]||'0').replace(',','.')) || 0);
  });
  if (!map.size) { toast('Không tìm thấy dòng mã vật tư hợp lệ'); return; }
  var s = X();
  s.plants = plants;
  s._it = Array.from(map.entries()).map(function(entry){ return [entry[0], entry[1].n, entry[1].u]; });
  var ltMap = {};
  Array.from(map.entries()).forEach(function(entry){ ltMap[entry[0]] = plants.map(function(p){ return rd(entry[1].q[p] || 0); }); });
  s._st = ltMap;
  rebuild(s);
  DB.doc('items/' + s.id).set({ list: s._it });
  DB.doc('stock/' + s.id).set({ lt: s._st });
  DB.doc('sess/' + s.id).update({ plants:plants });
  logEv('import', 'Nhập ' + s._it.length + ' mã');
  toast('Đã nhập ' + s._it.length + ' vật tư');
  refresh();
}

function saveUser(){
  if (!ADM) return;
  var uname = ($('uu').value||'').trim().toLowerCase(), name = ($('un').value||'').trim();
  var role = normRole($('ur').value), pw = $('up').value || '';
  var on = $('uon') ? $('uon').checked : true;
  var ex = USERS.find(function(x){ return x.u === uname; });
  if (!UOK.test(uname)) { toast('Tên đăng nhập không hợp lệ'); return; }
  if ((!ex || pw) && pw.length < 6) { toast('Mật khẩu ≥ 6 ký tự'); return; }
  var rec = ex ? Object.assign({}, ex) : { u: uname, cr: Date.now() };
  rec.name = name || uname; rec.role = role; rec.on = on;
  var stepP = Promise.resolve();
  if (pw) {
    var salt = (window.crypto && crypto.getRandomValues) ? crypto.getRandomValues(new Uint8Array(16)) : new Uint8Array(16);
    stepP = pbk(pw, salt).then(function(h){ rec.salt = b64(salt); rec.h = h; });
  }
  stepP.then(function(){ return DB.doc('users/' + uname).set(rec); }).then(function(){ return flushMuts(); }).then(function(){
    closeSheet();
    toast('Đã lưu tài khoản');
  });
}

function saveZone(zid){
  if (!MGR || lock()) return;
  var s = X(), name = ($('zn').value||'').trim();
  if (!name) { toast('Nhập tên khu vực'); return; }
  var users = Array.prototype.slice.call(document.querySelectorAll('.zu')).filter(function(e){ return e.checked; }).map(function(e){ return e.value; });
  var codes = Array.from(new Set(($('zc').value||'').split(/[\s,;]+/).filter(Boolean)));
  var list = s.zones.map(function(x){ return Object.assign({}, x, { codes:(x.codes||[]).filter(function(c){ return codes.indexOf(c) < 0; }) }); });
  var ex = list.find(function(x){ return x.id === zid; });

  else list.push({ id: Math.random().toString(36).slice(2,7), name:name, users:users, codes:codes });

function setTab(t){
  stopLiveScan();
  if (!MGR && (t===0||t===2||t===3)) t = 1;
  if (MGR && t===4) t = 1;
  tab = t;
  [0,1,2,3,4].forEach(function(i){ $('t'+i).classList.toggle('on', i===t); });
  ['setup','list','rep','hist','conf'].forEach(function(id,i){ $(id).style.display = i===t ? 'block' : 'none'; });
  $('hd').style.display = t===1 ? 'block' : 'none';
  refresh();
}

document.addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  if (b.id === 'initAdminBtn') return createInitialAdmin();
  if (b.id === 'lgin') return doLogin();
  if (b.id === 'syncBtn') return syncNow(true);
  if (b.id === 'out') return logout();
  if (b.id === 'aCancel') return closeSheet();
  if (b.id === 'scanOpenBtn') return openScanSheet();
  if (b.id === 'restartLiveCam') return startLiveCameraScan();
  if (b.id === 'manualScanGo') return handleScannedCode(($('manualScan')||{}).value);
  if (b.id === 'pickFileBtn' && $('fileImp')) return $('fileImp').click();
  if (b.dataset.usr) return userSheet(b.dataset.usr);
  if (b.id === 'addU') return userSheet('');
  if (b.id === 'usave') return saveUser();
  if (b.dataset.zone != null) return zoneSheet(b.dataset.zone);
  if (b.id === 'addZ') return zoneSheet('');
  if (b.id === 'zsave') return saveZone(b.dataset.id);
  if (b.id === 'newS') {
    var id = Date.now().toString(36);
    var dStr = today();
    var m = { name: 'Đợt ' + dStr, title: 'BIÊN BẢN KIỂM KÊ KHO THÚ Y', place: '', date: dStr, plants: [], closed: null, cr: Date.now() };
    ST.cur = id; lsS('kk_cur', id);
    DB.doc('sess/' + id).set(m);
    logEv('status', 'Tạo đợt kiểm kê mới');
    toast('Đã tạo đợt mới');
    return;
  }
  if (b.id === 'delS' && ST.cur) {
    gasCall('apiDeleteSession', ST.cur).then(function(){ return syncNow(true); });
    return;
  }
  if (b.id === 'saveMeta') {
    var s = X(); if (!s.id) return;
    s.name = ($('sname').value || '').trim() || s.name;
    s.title = ($('stitle') ? $('stitle').value : '').trim() || 'BIÊN BẢN KIỂM KÊ KHO THÚ Y';
    s.date = ($('sdate') && $('sdate').value) ? $('sdate').value : (s.date || today());
    s.place = ($('splace').value || '').trim();
    DB.doc('sess/' + s.id).update({ name: s.name, title: s.title, date: s.date, place: s.place });
    toast('Đã lưu thông tin đợt');
    return;
  }
  if (b.id === 'imp') return importPaste(($('paste')||{}).value || '');
  if (b.id === 'camBtn') {
    var code = prompt('Nhập / quét mã vật tư lẻ:'); if (!code) return;
    var s2 = X(); if (!s2.id || !s2.plants.length) { toast('Hãy nhập tồn kho trước'); return; }
    s2._it.push([code.trim(), '', '']); rebuild(s2);
    DB.doc('items/' + s2.id).set({ list: s2._it });
    refresh();
    return;
  }
  if (b.classList.contains('item') && b.dataset.i != null) return openSheet(+b.dataset.i);
  if (b.classList.contains('chip') && b.dataset.f) { filt = b.dataset.f; return renderList(); }
  if (b.classList.contains('step')) {
    var k = +b.dataset.k, inp = $('n'+k);
    inp.value = rd(Math.max(0, (parseFloat(inp.value)||0) + +b.dataset.s));
    return;
  }
  if (b.id === 'ok') return saveCount();
  if (b.id === 'prt') return window.print();
  if (b.id === 'clo' && X().id) {
    var cl = { t: Date.now(), by: DISPN };
    X().closed = cl;
    DB.doc('sess/' + X().id).update({ closed: cl });
    logEv('status', 'Đóng kiểm kê');
    refresh();
    return;
  }
  if (b.id === 'reop' && X().id) {
    X().closed = null;
    DB.doc('sess/' + X().id).update({ closed: null });
    logEv('status', 'Mở lại kiểm kê');
    refresh();
    return;
  }
  if (b.id === 'dok' && X().id) {
    var t = Date.now();
    DB.doc('done/' + X().id + '_' + UID).set({ sid: X().id, u: UID, t:t });
    logEv('status', 'Xác nhận hoàn tất');
    refresh();
    return;
  }
  if (b.id === 't0') setTab(0);
  if (b.id === 't1') setTab(1);
  if (b.id === 't2') setTab(2);
  if (b.id === 't3') setTab(3);
  if (b.id === 't4') setTab(4);
});
